# Monks Of Market — scheduled auto-publish
#
# Publishes ONE held article every Monday and Thursday at 08:00 IST,
# straight from the staged bundles in scheduled/, with no human in the
# loop. The pick is the earliest queue row that is not yet live and whose
# publish_date has arrived. Cloudflare auto-deploys on push to main.
#
# Safety:
# - `npm run build` runs BEFORE the push; a failed build publishes nothing.
# - Rows flagged amazon_placeholder (placeholder Amazon buy links) are
#   refused by the script — the run fails loudly instead of publishing
#   placeholder links. Fix the staged files first.
# - After pushing, the workflow curls the live URL for up to ~12 minutes;
#   on failure it opens a GitHub issue so the miss is visible.
# - Manual runs: workflow_dispatch with dry_run=true (default) validates
#   without publishing anything.
name: Auto-publish scheduled article

on:
  schedule:
    # 02:30 UTC = 08:00 IST (IST has no DST), Mon + Thu
    - cron: '30 2 * * 1,4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, publish nothing)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pick + stage next due article
        id: pick
        run: python3 .github/scripts/auto-publish.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Set up Node
        if: ${{ steps.pick.outputs.published == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build check (must pass before any push)
        if: ${{ steps.pick.outputs.published == 'true' }}
        run: |
          npm ci
          npm run build

      - name: Commit + push to main
        if: ${{ steps.pick.outputs.published == 'true' }}
        run: |
          git config user.name 'monks-auto-publish'
          git config user.email 'monks-auto-publish@users.noreply.github.com'
          git add src/content/articles src/pages/articles scheduled/publish-log.md
          git commit -m "auto-publish: row #${{ steps.pick.outputs.row }} ${{ steps.pick.outputs.slug }}"
          git push

      - name: Verify live on monksofmarket.com
        if: ${{ steps.pick.outputs.published == 'true' }}
        env:
          ARTICLE_URL: https://monksofmarket.com${{ steps.pick.outputs.url }}
          ROW: ${{ steps.pick.outputs.row }}
          SLUG: ${{ steps.pick.outputs.slug }}
          TITLE: ${{ steps.pick.outputs.title }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$ARTICLE_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "LIVE: $ARTICLE_URL"
              exit 0
            fi
            echo "attempt $i: HTTP $code — waiting 30s..."
            sleep 30
          done
          echo "FAILED: $ARTICLE_URL did not return HTTP 200 after ~12 minutes"
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api "repos/${{ github.repository }}/issues" \
            -f title="Auto-publish verification failed: row #$ROW $SLUG" \
            -f body="The auto-publish run pushed row #$ROW ($TITLE, $ARTICLE_URL) to main, but the live URL did not return HTTP 200 within ~12 minutes. Check the Cloudflare Pages build for this commit; the article file IS in the repo. Next scheduled run will move on to the following row only if this slug's file exists — verify the page is actually live before closing this issue."
          exit 1
